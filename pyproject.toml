[tool.pytest.ini_options]
pythonpath = ["."]
# Гарантирует, что корень репозитория попадает в sys.path при запуске
# тестов, независимо от способа вызова (`pytest` или `python -m pytest`),
# чтобы `import org_structure` из tests/ работал без дополнительных настроек.

markers = [
    "integration: тест с реальным подключением к PostgreSQL (нужен docker compose up -d --wait)",
]

# По умолчанию integration-тесты пропускаются (нужен настоящий Postgres) —
# запустить их явно: pytest -m integration
addopts = "-m 'not integration'"
