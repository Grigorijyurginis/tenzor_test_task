services:
  postgres:
    image: postgres:10
    container_name: org_structure_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-org_structure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-org_structure}
      POSTGRES_DB: ${POSTGRES_DB:-org_structure}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - org_structure_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-org_structure} -d ${POSTGRES_DB:-org_structure}",
        ]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  org_structure_pgdata:
